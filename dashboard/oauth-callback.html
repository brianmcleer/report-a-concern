<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sign-in callback</title>
    <script>
      // Standard ArcGIS Maps SDK OAuth callback. Parses the token from the
      // redirect URL fragment and posts it back to the opener window, then
      // closes itself.
      //
      // This file MUST be served from the same origin as the dashboard and
      // registered as a Redirect URI on the OAuth app in Portal:
      //
      //   https://gis-internal.example.gov/reportaconcerndashboard/oauth-callback.html
      function loadHandler() {
        if (opener) {
          if (location.hash) {
            if (typeof opener.require === "function" && opener.require("esri/kernel")) {
              opener.require("esri/kernel").id.setOAuthResponseHash(location.hash);
            } else {
              opener.dispatchEvent(new CustomEvent("arcgis:auth:hash", { detail: location.hash }));
            }
            close();
          } else if (location.search) {
            opener.dispatchEvent(new CustomEvent("arcgis:auth:location:search", { detail: location.search }));
            close();
          }
        } else {
          close();
        }
      }
    </script>
  </head>
  <body onload="loadHandler();"></body>
</html>
